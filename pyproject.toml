[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaitfm"
version = "0.1.0"
description = "Gait foundation model training and downstream evaluation code"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
py-modules = ["gaitfm"]

[tool.setuptools.packages.find]
where = ["."]
include = ["data_provider*", "exp*", "models*", "utils*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
